<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Photo Gallery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef0f2;--ink:#1b1f24;--mute:#5d6671;--accent:#2f5bff;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--ink:#eceff2;--mute:#9aa4af;--accent:#7b97ff;--card:#1e2328}}
:root[data-theme="dark"]{--bg:#14171b;--ink:#eceff2;--mute:#9aa4af;--accent:#7b97ff;--card:#1e2328}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
header{max-width:1100px;margin:0 auto;padding:48px 20px 24px}
h1{font-size:clamp(2.4rem,8vw,4.8rem);line-height:1;margin:0 0 12px;font-weight:800;letter-spacing:-.03em}
header p{margin:0;max-width:52ch;color:var(--mute)}
.bar{max-width:1100px;margin:0 auto;padding:8px 20px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button,.bar label{font:inherit;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar label{margin-left:auto;border-color:var(--accent);background:var(--accent);color:#fff}
.bar input{display:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:0 20px 64px;columns:3 260px;column-gap:14px}
figure{margin:0 0 14px;break-inside:avoid;background:var(--card);border-radius:6px;overflow:hidden;cursor:zoom-in;border:0;padding:0;display:block;width:100%;text-align:left;color:inherit;font:inherit}
figure img{display:block;width:100%;height:auto}
figcaption{padding:10px 12px;font-size:.9rem}
#lb{position:fixed;inset:0;background:rgba(10,12,15,.94);display:none;align-items:center;justify-content:center;flex-direction:column;padding:56px 16px;z-index:9}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb p{color:#eceff2;margin:12px 0 0}
#lb button{position:absolute;background:none;border:0;color:#fff;font-size:2rem;cursor:pointer;padding:12px}
#x{top:calc(8px + env(safe-area-inset-top,0px));right:8px}#pv{left:4px;top:50%}#nx{right:4px;top:50%}
footer{text-align:center;color:var(--mute);padding:0 20px 40px;font-size:.9rem}
</style>
</head>
<body>
<header>
<h1>Through my lens</h1>
<p>A small collection of moments I stopped to photograph. Tap any photo to view it larger.</p>
</header>
<div class="bar" id="bar">
<label>Add photos<input type="file" id="up" accept="image/*" multiple></label>
</div>
<main id="grid" aria-live="polite"></main>
<footer>Photos added with "Add photos" show only on your screen.</footer>
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
<button id="x" aria-label="Close">&times;</button><button id="pv" aria-label="Previous">&#8249;</button><button id="nx" aria-label="Next">&#8250;</button>
<img id="big" alt=""><p id="cap"></p>
</div>
<script>
// STEP 1: the data. Replace these entries with your own photos (src = image address).
function ph(c1,c2,w,h){var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/></svg>';return 'data:image/svg+xml;utf8,'+encodeURIComponent(s)}
var photos=[
{t:"Morning light",c:"Landscape",src:,
{t:"Quiet street",c:"City",src:,
{t:"River bend",c:"Landscape",src:,
{t:"Market day",c:"People",src:,
{t:"Rooftops",c:"City",src:,
{t:"Portrait study",c:"People",src:
];
var shown=photos,idx=0,cat="All";
var grid=document.getElementById("grid"),bar=document.getElementById("bar");
// STEP 2: draw the grid from the data.
function render(){
 shown=photos.filter(function(p){return cat==="All"||p.c===cat});
 grid.innerHTML="";
 shown.forEach(function(p,i){
  var f=document.createElement("figure");f.tabIndex=0;f.setAttribute("role","button");
  f.innerHTML='<img loading="lazy" alt=""><figcaption></figcaption>';
  f.querySelector("img").src=p.src;f.querySelector("img").alt=p.t;f.querySelector("figcaption").textContent=p.t;
  f.onclick=function(){open(i)};
  f.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open(i)}};
  grid.appendChild(f);
 });
}
// STEP 3: category filter buttons built from the data.
function filters(){
 bar.querySelectorAll("button").forEach(function(b){b.remove()});
 var cats=["All"].concat(photos.map(function(p){return p.c}).filter(function(v,i,a){return a.indexOf(v)===i}));
 cats.reverse().forEach(function(c){
  var b=document.createElement("button");b.textContent=c;b.setAttribute("aria-pressed",c===cat);
  b.onclick=function(){cat=c;filters();render()};bar.prepend(b);
 });
}
// STEP 4: the lightbox (big viewer).
var lb=document.getElementById("lb"),big=document.getElementById("big"),cap=document.getElementById("cap");
function open(i){idx=(i+shown.length)%shown.length;big.src=shown[idx].src;big.alt=shown[idx].t;cap.textContent=shown[idx].t;lb.classList.add("on")}
function close(){lb.classList.remove("on")}
document.getElementById("x").onclick=close;
document.getElementById("pv").onclick=function(){open(idx-1)};
document.getElementById("nx").onclick=function(){open(idx+1)};
lb.onclick=function(e){if(e.target===lb)close()};
document.onkeydown=function(e){if(!lb.classList.contains("on"))return;
 if(e.key==="Escape")close();if(e.key==="ArrowLeft")open(idx-1);if(e.key==="ArrowRight")open(idx+1)};
// STEP 5: let a visitor preview their own photos (stays in their browser only).
document.getElementById("up").onchange=function(e){
 Array.prototype.forEach.call(e.target.files,function(f){
  photos.unshift({t:f.name.replace(/\.[^.]+$/,""),c:"Mine",src:URL.createObjectURL(f)});
 });
 cat="All";filters();render();
};
filters();render();
</script>
</body>
</html>
