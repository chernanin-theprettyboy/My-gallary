<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Photo Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f7;--ink:#22303a;--mute:#66737d;--line:#d5dde2;--accent:#4f7f86;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
/* background layout: */
 body{margin:0;background-color:var(--bg);
 color:var(--ink);font-family:"Roboto Slab",system-ui,sans-serif;line-height:1.6}
header{max-width:1100px;margin:0 auto;padding:72px 24px 28px}
h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.1;margin:0 0 14px;font-weight:300;letter-spacing:.01em}
header p{margin:0;max-width:48ch;color:var(--mute);font-size:1.05rem}
.bar{max-width:1100px;margin:0 auto;padding:8px 24px 28px;display:flex;flex-wrap:wrap;gap:10px}
.bar button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--mute);padding:6px 18px;border-radius:999px;cursor:pointer;transition:all .2s}
.bar button:hover{border-color:var(--accent);color:var(--ink)}
.bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onacc,#fff)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
main{max-width:1100px;margin:0 auto;padding:0 24px 80px;columns:3 280px;column-gap:20px}
figure{margin:0 0 20px;break-inside:avoid;background:var(--card);border-radius:10px;overflow:hidden;cursor:zoom-in;padding:0;display:block;width:100%;text-align:left;color:inherit;font:inherit;box-shadow:0 1px 3px rgba(34,48,58,.08);transition:box-shadow .25s}
figure:hover{box-shadow:0 8px 24px rgba(34,48,58,.14)}
figure img{display:block;width:100%;height:auto;filter:var(--grade,saturate(.95) contrast(1.03) brightness(1.02));transition:filter .3s}
figure:hover img{filter:none}
figcaption{padding:12px 16px;font-size:.95rem;color:var(--mute)}
#lb{position:fixed;inset:0;background:var(--lb,rgba(244,246,247,.97));display:none;align-items:center;justify-content:center;flex-direction:column;padding:56px 16px;z-index:9}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#lb p{color:var(--ink);margin:14px 0 0}
#lb button{position:absolute;background:none;border:0;color:var(--ink);font-size:2rem;cursor:pointer;padding:12px}
#x{top:calc(8px + env(safe-area-inset-top,0px));right:8px}#pv{left:4px;top:50%}#nx{right:4px;top:50%}
#cz{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;font:inherit;background:var(--accent);color:var(--onacc,#fff);border:0;border-radius:999px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.18)}
#pn{position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:5;width:min(300px,calc(100vw - 32px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
#pn[hidden]{display:none}
#pn p{margin:0 0 8px;color:var(--mute);font-size:.9rem}
#pn label{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
#pn input[type=color]{width:44px;height:30px;border:1px solid var(--line);background:none;padding:0;border-radius:6px;cursor:pointer}
#pn select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.pill{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer;margin:0 6px 6px 0}
#rs{font:inherit;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0}
/* Animation */
 body::before{
  content:"";
  position:fixed;
  inset:-20%;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(circle at 30% 45%,color-mix(in srgb,var(--accent) 60%,transparent),transparent 30%),
    radial-gradient(circle at 20% 30%,color-mix(in srgb,var(--accent) 40%,transparent),transparent 40%);
  animation:drift 4s ease-in-out infinite alternate;
}
@keyframes drift{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(4%,-3%) scale(1.15)}
}
@media (prefers-reduced-motion:reduce){
  body::before{animation:none}
}
/* Animation */
body::before {
  content: "";
  position: fixed;
  inset: -20%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 70%, color-mix(in srgb, var(--accent) 90%, transparent), transparent 60%),
    radial-gradient(circle at 80% 70%, color-mix(in srgb, var(--accent) 60%, transparent), transparent 60%);
  animation: drift 4s ease-in-out infinite alternate;
}
@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to { transform: translate(4%, -3%) scale(1.15); }
}
/* Sakura falling petals */
.sakura-container {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}
.petal {
  position: absolute;
  top: -40px;
  font-size: 22px;
  opacity: 0.85;
  animation: sakura-fall 10s linear infinite;
}
.petal span {
  display: block;
  animation: sakura-sway 3s ease-in-out infinite alternate;
}
@keyframes sakura-fall {
  from { transform: translateY(0); }
  to { transform: translateY(110vh); }
}
@keyframes sakura-sway {
  from { transform: translateX(-25px) rotate(0deg); }
  to { transform: translateX(25px) rotate(90deg); }
}
/* Keep your gallery content above the petals */
header, .bar, #grid {
  position: relative;
  z-index: 2;
}
@media (prefers-reduced-motion: reduce) {
  body::before {
    animation: none;
  }
.sakura-container {
    display: none;
  }
}
.avg{margin-left:8px;align-self:center;font-size:.85rem;color:var(--mute)}
</style>
</head>
<body>

<!-- Sakura falling petals -->
<div class="sakura-container" aria-hidden="true">
  <div class="petal" style="left:5%; animation-delay:0s"><span>🌸</span></div>
  <div class="petal" style="left:20%; animation-delay:3s"><span>🌸</span></div>
  <div class="petal" style="left:35%; animation-delay:6s"><span>🌸</span></div>
  <div class="petal" style="left:50%; animation-delay:1s"><span>🌸</span></div>
  <div class="petal" style="left:65%; animation-delay:4s"><span>🌸</span></div>
  <div class="petal" style="left:80%; animation-delay:2s"><span>🌸</span></div>
  <div class="petal" style="left:95%; animation-delay:5s"><span>🌸</span></div>
</div>

<header>
<h1>Through my lens</h1>
<p>A small collection of moments I stopped to photograph. Tap any photo to view it larger.</p>
</header>
<div class="bar" id="bar">
</div>
<main id="grid" aria-live="polite"></main>
<button id="cz" aria-expanded="false" aria-controls="pn">Customize</button>
<div id="pn" hidden>
<p>Theme</p><div id="pr"></div>
<label>Background <input type="color" id="cbg"></label>
<label>Accent <input type="color" id="cac"></label>
<label>Photo look <select id="cg"><option value="none">Original</option><option value="soft">Soft</option><option value="warm">Warm film</option><option value="mono">Black and white</option></select></label>
<button id="rs">Reset to default</button>
</div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
<button id="x" aria-label="Close">&times;</button><button id="pv" aria-label="Previous">&#8249;</button><button id="nx" aria-label="Next">&#8250;</button>
<img id="big" alt=""><p id="cap"></p>
</div>
<script src="photos.js"></script>
<script>
// STEP 1: the data. One line per photo: t = title, c = category, src = file name.

var shown=photos,idx=0,cat="All";
var grid=document.getElementById("grid"),bar=document.getElementById("bar");
// STEP 2: draw the grid from the data.
function render(){
 shown=photos.filter(function(p){return cat==="All"||p.c===cat});
 grid.innerHTML="";
 shown.forEach(function(p,i){
  var f=document.createElement("figure");f.tabIndex=0;f.setAttribute("role","button");
  f.innerHTML='<img loading="lazy" alt=""><figcaption></figcaption>';
  f.querySelector("img").src=p.src;f.querySelector("img").alt=p.t;f.querySelector("figcaption").textContent=p.t;
  f.onclick=function(){open(i)};
  f.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open(i)}};
  grid.appendChild(f);
 });
}
// STEP 3: category filter buttons built from the data.
function filters(){
 bar.querySelectorAll("button").forEach(function(b){b.remove()});
 var cats=["All"].concat(photos.map(function(p){return p.c}).filter(function(v,i,a){return a.indexOf(v)===i}));
 cats.reverse().forEach(function(c){
  var b=document.createElement("button");b.textContent=c;b.setAttribute("aria-pressed",c===cat);
  b.onclick=function(){cat=c;filters();render()};bar.prepend(b);
 });
}
// STEP 4: the lightbox (big viewer).
var lb=document.getElementById("lb"),big=document.getElementById("big"),cap=document.getElementById("cap");
function open(i){idx=(i+shown.length)%shown.length;big.src=shown[idx].src;big.alt=shown[idx].t;cap.textContent=shown[idx].t;lb.classList.add("on")}
function close(){lb.classList.remove("on")}
document.getElementById("x").onclick=close;
document.getElementById("pv").onclick=function(){open(idx-1)};
document.getElementById("nx").onclick=function(){open(idx+1)};
lb.onclick=function(e){if(e.target===lb)close()};
document.onkeydown=function(e){if(!lb.classList.contains("on"))return;
 if(e.key==="Escape")close();if(e.key==="ArrowLeft")open(idx-1);if(e.key==="ArrowRight")open(idx+1)};
// STEP 5: visitor theme controls. Everything is saved in the visitor's own browser only.
var G={none:"none",soft:"saturate(.95) contrast(1.03) brightness(1.02)",warm:"sepia(.2) saturate(1.15) contrast(1.05)",mono:"grayscale(1) contrast(1.1)"};
var P=[{n:"Calm",bg:"#f4f6f7",ac:"#4f7f86",g:"soft"},{n:"Midnight",bg:"#0f1115",ac:"#ffb454",g:"none"},{n:"Warm film",bg:"#efe6da",ac:"#b5651d",g:"warm"},{n:"Mist",bg:"#e3ebf1",ac:"#2f6fed",g:"soft"}];
var st={bg:P[0].bg,ac:P[0].ac,g:P[0].g};
try{var x=JSON.parse(localStorage.getItem("gal-theme"));if(x&&/^#[0-9a-f]{6}$/i.test(x.bg)&&/^#[0-9a-f]{6}$/i.test(x.ac)&&G[x.g])st=x}catch(e){}
function rgb(h){return [1,3,5].map(function(i){return parseInt(h.substr(i,2),16)})}
function hex(a){return "#"+a.map(function(v){return ("0"+Math.round(v).toString(16)).slice(-2)}).join("")}
function mix(a,b,t){return a.map(function(v,i){return v+(b[i]-v)*t})}
function lum(c){return (0.299*c[0]+0.587*c[1]+0.114*c[2])/255}
function apply(){
 var b=rgb(st.bg),a=rgb(st.ac),light=lum(b)>0.55,ink=light?[34,48,58]:[238,241,243],r=document.documentElement.style;
 r.setProperty("--bg",st.bg);r.setProperty("--ink",hex(ink));r.setProperty("--mute",hex(mix(ink,b,.4)));
 r.setProperty("--line",hex(mix(b,ink,.18)));r.setProperty("--card",light?"#ffffff":hex(mix(b,[255,255,255],.07)));
 r.setProperty("--accent",st.ac);r.setProperty("--onacc",lum(a)>0.6?"#22303a":"#ffffff");
 r.setProperty("--lb","rgba("+b.join(",")+",.97)");r.setProperty("--grade",G[st.g]);
 document.getElementById("cbg").value=st.bg;document.getElementById("cac").value=st.ac;document.getElementById("cg").value=st.g;
 try{localStorage.setItem("gal-theme",JSON.stringify(st))}catch(e){}
}
var pr=document.getElementById("pr");
P.forEach(function(p){var b=document.createElement("button");b.className="pill";b.textContent=p.n;
 b.onclick=function(){st={bg:p.bg,ac:p.ac,g:p.g};apply()};pr.appendChild(b)});
document.getElementById("cbg").oninput=function(e){st.bg=e.target.value;apply()};
document.getElementById("cac").oninput=function(e){st.ac=e.target.value;apply()};
document.getElementById("cg").onchange=function(e){st.g=e.target.value;apply()};
document.getElementById("rs").onclick=function(){st={bg:P[0].bg,ac:P[0].ac,g:P[0].g};apply()};
var cz=document.getElementById("cz"),pn=document.getElementById("pn");
cz.onclick=function(){pn.hidden=!pn.hidden;cz.setAttribute("aria-expanded",!pn.hidden)};
apply();
 // STEP 6: star ratings, shared through Supabase
var SB_URL="https://avrkgnnprvjfobzzwwkw.supabase.co";
var SB_KEY="sb_publishable_7y3Xhi1rjK_ofvH1UW2pAQ_AnyHnaL_";

var ratings={},stats={},voter="";
try{ratings=JSON.parse(localStorage.getItem("gal-ratings"))||{}}catch(e){}
try{voter=localStorage.getItem("gal-voter")||""}catch(e){}
if(!voter){
 voter=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():"v"+Date.now()+Math.random().toString(36).slice(2);
 try{localStorage.setItem("gal-voter",voter)}catch(e){}
}
function saveRatings(){try{localStorage.setItem("gal-ratings",JSON.stringify(ratings))}catch(e){}}

function sb(fn,body){
 return fetch(SB_URL+"/rest/v1/rpc/"+fn,{
  method:"POST",
  headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
  body:JSON.stringify(body||{})
 }).then(function(r){
  if(!r.ok)throw new Error("Supabase error "+r.status);
  return r.text();
 }).then(function(t){return t?JSON.parse(t):null});
}
function loadStats(){
 sb("photo_stats").then(function(rows){
  stats={};(rows||[]).forEach(function(r){stats[r.photo]=r});render();
 }).catch(function(e){console.log(e)});
}
function paint(box,v){box.querySelectorAll("button").forEach(function(b,i){b.className=i<v?"on":""})}
function stars(p){
 var box=document.createElement("div");box.className="stars";
 for(var n=1;n<=5;n++){(function(n){
  var s=document.createElement("button");s.type="button";s.textContent="★";
  s.setAttribute("aria-label","Rate "+n+" out of 5");
  s.onclick=function(e){
   e.stopPropagation();
   ratings[p.src]=n;saveRatings();paint(box,n);
   sb("rate_photo",{p_photo:p.src,p_voter:voter,p_stars:n}).then(loadStats).catch(function(e){console.log(e)});
  };
  s.onkeydown=function(e){e.stopPropagation()};
  box.appendChild(s)})(n)}
 paint(box,ratings[p.src]||0);
 var info=document.createElement("span");info.className="avg";
 var st=stats[p.src];
 info.textContent=st?(st.average+" ("+st.votes+")"):"No votes yet";
 box.appendChild(info);
 return box}
filters();render();
loadStats();
</script>
</body>
</html>
